name: MAVULA Guardian
on:
  pull_request: {}
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22.22.3 }
      - run: node scripts/guardian.mjs
